services:
  foundry:
    build: .
    container_name: foundry
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      NODE_ENV: production
      PORT: 9090
      DATA_DIR: /data
      # Set a password to protect the app (leave empty to disable auth)
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - foundry_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  foundry_data:
    name: foundry_data
